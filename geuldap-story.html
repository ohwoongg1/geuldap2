<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, updateDoc, getDocs, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyC5nf84GbQQ_5vIDwhIvTZ5zPqf7nrnSxU",
    authDomain: "starspoon-120d7.firebaseapp.com",
    projectId: "starspoon-120d7",
    storageBucket: "starspoon-120d7.firebasestorage.app",
    messagingSenderId: "672370227821",
    appId: "1:672370227821:web:aea1d9c6ca8587842a5d64"
  });
  const db = getFirestore(app);
  const storage = getStorage(app);
  const auth = getAuth(app);
  try { await signInAnonymously(auth); } catch (e) { console.log('익명 인증 실패:', e); }

  window._db = db;
  window._storage = storage;
  window._storageRef = ref;
  window._uploadString = uploadString;
  window._getDownloadURL = getDownloadURL;
  window._col = collection;
  window._addDoc = addDoc;
  window._updateDoc = updateDoc;
  window._getDocs = getDocs;
  window._query = query;
  window._orderBy = orderBy;
  window._doc = doc;
  window._deleteDoc = deleteDoc;

  window._posts = [];

  async function loadPosts() {
    try {
      const q = window._query(window._col(window._db, 'geuldap_posts'), window._orderBy('createdAt', 'desc'));
      const snap = await window._getDocs(q);
      window._posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) {
      console.log('글답 이야기 목록 로드 실패:', e);
      window._posts = [];
    }
    renderList();
    handleRoute();
  }

  let editingPostId = null;

  window.savePost = async function() {
    const title = document.getElementById('postTitle').value.trim();
    const body = document.getElementById('postBody').value.trim();
    const tag = document.getElementById('postTag').value;
    if (!title || !body) { alert('제목과 내용을 입력해주세요.'); return; }
    try {
      if (editingPostId) {
        await window._updateDoc(window._doc(window._db, 'geuldap_posts', editingPostId), { title, body, tag });
        document.getElementById('postSaveMsg').textContent = '✅ 수정되었습니다';
      } else {
        const post = { title, body, tag, createdAt: Date.now(), dateLabel: todayLabel() };
        await window._addDoc(window._col(window._db, 'geuldap_posts'), post);
        document.getElementById('postSaveMsg').textContent = '✅ 게시되었습니다';
      }
      const wasEditing = editingPostId;
      resetAdminForm();
      setTimeout(() => document.getElementById('postSaveMsg').textContent = '', 3000);
      await loadPosts();
      if (wasEditing) {
        const params = new URLSearchParams(location.search);
        if (params.get('post') === wasEditing) {
          const post = window._posts.find(p => p.id === wasEditing);
          if (post) showDetail(post);
        }
      }
    } catch (e) {
      alert('저장 실패: ' + e.message);
    }
  };

  window.editPost = function(id) {
    const post = window._posts.find(p => p.id === id);
    if (!post) return;
    if (!document.getElementById('adminPanel').classList.contains('open')) {
      const pw = prompt('원장님 확인용 비밀번호를 입력해주세요');
      if (pw !== '0147') { if (pw !== null) alert('비밀번호가 일치하지 않습니다.'); return; }
      document.getElementById('adminPanel').classList.add('open');
    }
    editingPostId = id;
    document.getElementById('adminPanelTitle').textContent = '✏️ 글 수정 중';
    document.getElementById('postTitle').value = post.title;
    document.getElementById('postTag').value = post.tag || '옥길동';
    document.getElementById('postBody').value = post.body;
    refreshImagePreviewFromBody();
    document.getElementById('postSubmitBtn').textContent = '💾 수정 저장';
    document.getElementById('postCancelBtn').style.display = 'inline-block';
    document.getElementById('adminPanel').scrollIntoView({ behavior: 'smooth' });
  };

  window.resetAdminForm = function() {
    editingPostId = null;
    document.getElementById('adminPanelTitle').textContent = '✏️ 새 글쓰기';
    document.getElementById('postTitle').value = '';
    document.getElementById('postBody').value = '';
    document.getElementById('postTag').value = '옥길동';
    document.getElementById('imagePreviewRow').innerHTML = '';
    document.getElementById('imageUploadMsg').textContent = '';
    document.getElementById('postSubmitBtn').textContent = '✏️ 게시하기';
    document.getElementById('postCancelBtn').style.display = 'none';
  };

  window.deletePost = async function(id) {
    if (!confirm('이 글을 삭제할까요?')) return;
    try {
      await window._deleteDoc(window._doc(window._db, 'geuldap_posts', id));
      await loadPosts();
    } catch (e) {
      alert('삭제 실패: ' + e.message);
    }
  };

  // ===== 사진 업로드 + 이름 가리기(스티커) 편집기 =====
  let redactQueue = [];
  let redactImg = null;
  let redactBoxes = [];
  let redactCanvas = null, redactCtx = null;
  let redactCurrentFileName = '';
  let redactDrawing = false, redactStartX = 0, redactStartY = 0, redactCurX = 0, redactCurY = 0;
  let pendingInsertPos = null; // 사진 선택하는 순간의 커서 위치를 미리 기억해둔다(가리기 창이 뜨는 동안 포커스가 빠져나가도 안전하게)

  window.handleImageSelect = function(event) {
    const files = Array.from(event.target.files || []);
    event.target.value = '';
    if (files.length === 0) return;
    const textarea = document.getElementById('postBody');
    pendingInsertPos = textarea.selectionStart ?? textarea.value.length;
    redactQueue = files;
    processNextRedactFile();
  };

  function processNextRedactFile() {
    if (redactQueue.length === 0) return;
    const file = redactQueue.shift();
    redactCurrentFileName = file.name;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        redactImg = img;
        redactBoxes = [];
        const maxW = Math.min(img.width, 700);
        const scale = maxW / img.width;
        redactCanvas = document.getElementById('redactCanvas');
        redactCanvas.width = Math.round(img.width * scale);
        redactCanvas.height = Math.round(img.height * scale);
        redactCtx = redactCanvas.getContext('2d');
        redrawRedactCanvas();
        setupRedactEvents();
        document.getElementById('redactModal').classList.add('open');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function redrawRedactCanvas() {
    redactCtx.clearRect(0, 0, redactCanvas.width, redactCanvas.height);
    redactCtx.drawImage(redactImg, 0, 0, redactCanvas.width, redactCanvas.height);
    redactCtx.fillStyle = 'rgba(20,20,20,0.95)';
    redactBoxes.forEach(b => redactCtx.fillRect(b.x, b.y, b.w, b.h));
  }

  function canvasPosFromEvent(e) {
    const rect = redactCanvas.getBoundingClientRect();
    const scaleX = redactCanvas.width / rect.width;
    const scaleY = redactCanvas.height / rect.height;
    if (e.touches && e.touches[0]) {
      return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
    }
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  function setupRedactEvents() {
    const c = redactCanvas;
    const start = (e) => { const p = canvasPosFromEvent(e); redactDrawing = true; redactStartX = p.x; redactStartY = p.y; redactCurX = p.x; redactCurY = p.y; e.preventDefault(); };
    const move = (e) => {
      if (!redactDrawing) return;
      const p = canvasPosFromEvent(e); redactCurX = p.x; redactCurY = p.y;
      redrawRedactCanvas();
      redactCtx.fillStyle = 'rgba(20,20,20,0.6)';
      redactCtx.fillRect(Math.min(redactStartX,redactCurX), Math.min(redactStartY,redactCurY), Math.abs(redactCurX-redactStartX), Math.abs(redactCurY-redactStartY));
      e.preventDefault();
    };
    const end = (e) => {
      if (!redactDrawing) return;
      redactDrawing = false;
      const w = Math.abs(redactCurX-redactStartX), h = Math.abs(redactCurY-redactStartY);
      if (w > 4 && h > 4) {
        redactBoxes.push({ x: Math.min(redactStartX,redactCurX), y: Math.min(redactStartY,redactCurY), w, h });
      }
      redrawRedactCanvas();
      e.preventDefault();
    };
    c.onmousedown = start; c.onmousemove = move; c.onmouseup = end; c.onmouseleave = end;
    c.ontouchstart = start; c.ontouchmove = move; c.ontouchend = end;
  }

  window.undoRedactBox = function() {
    redactBoxes.pop();
    redrawRedactCanvas();
  };

  window.confirmRedact = async function() {
    document.getElementById('redactModal').classList.remove('open');
    const dataUrl = redactCanvas.toDataURL('image/jpeg', 0.88);
    await uploadImageDataUrl(dataUrl, redactCurrentFileName);
    processNextRedactFile();
  };

  async function uploadImageDataUrl(dataUrl, fileName) {
    const msg = document.getElementById('imageUploadMsg');
    const textarea = document.getElementById('postBody');
    msg.textContent = `📤 ${fileName} 업로드 중...`;
    try {
      const path = `geuldap_posts_images/${Date.now()}_${fileName}`;
      const r = window._storageRef(window._storage, path);
      await window._uploadString(r, dataUrl, 'data_url');
      const url = await window._getDownloadURL(r);

      const marker = `\n[[img:${url}]]\n`;
      const start = pendingInsertPos ?? textarea.value.length;
      textarea.value = textarea.value.slice(0, start) + marker + textarea.value.slice(start);
      pendingInsertPos = start + marker.length; // 다음 사진(같이 선택한 여러 장)은 방금 넣은 사진 바로 뒤에 이어붙게 됨
      textarea.selectionStart = textarea.selectionEnd = pendingInsertPos;

      refreshImagePreviewFromBody();
      msg.textContent = '✅ 업로드 완료 — 썸네일을 클릭하면 삭제할 수 있어요';
    } catch (e) {
      alert('사진 업로드 실패: ' + e.message);
    }
  }

  // "글 내용" 칸(postBody)에 실제로 들어있는 [[img:...]] 마커들을 기준으로 미리보기 썸네일을 다시 그린다.
  // 썸네일을 클릭하면 본문에서 그 사진 마커를 지운다.
  function refreshImagePreviewFromBody() {
    const body = document.getElementById('postBody').value;
    const urls = [];
    const regex = /\[\[img:(.+?)\]\]/g;
    let m;
    while ((m = regex.exec(body)) !== null) urls.push(m[1]);
    const row = document.getElementById('imagePreviewRow');
    row.innerHTML = '';
    urls.forEach(url => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative; width:64px; height:64px;';
      const img = document.createElement('img');
      img.src = url;
      img.title = '클릭하면 이 사진을 글에서 삭제해요';
      img.style.cssText = 'width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid #ddd; cursor:pointer;';
      img.onclick = () => removeImageFromBody(url);
      const x = document.createElement('div');
      x.textContent = '×';
      x.style.cssText = 'position:absolute; top:-6px; right:-6px; width:18px; height:18px; background:#b3261e; color:#fff; border-radius:50%; font-size:12px; line-height:18px; text-align:center; pointer-events:none;';
      wrap.appendChild(img);
      wrap.appendChild(x);
      row.appendChild(wrap);
    });
  }

  window.removeImageFromBody = function(url) {
    if (!confirm('이 사진을 글에서 삭제할까요?')) return;
    const textarea = document.getElementById('postBody');
    const escaped = url.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('\\n?\\[\\[img:' + escaped + '\\]\\]\\n?', 'g');
    textarea.value = textarea.value.replace(re, '\n');
    refreshImagePreviewFromBody();
  };

  function todayLabel() {
    const d = new Date();
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  }

  window.toggleAdmin = function() {
    const panel = document.getElementById('adminPanel');
    if (panel.classList.contains('open')) { panel.classList.remove('open'); renderList(); return; }
    const pw = prompt('원장님 확인용 비밀번호를 입력해주세요');
    if (pw === '0147') { panel.classList.add('open'); renderList(); }
    else if (pw !== null) alert('비밀번호가 일치하지 않습니다.');
  };

  function escapeHtml(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  window.openLightbox = function(url) {
    document.getElementById('lightboxImg').src = url;
    document.getElementById('lightboxBg').classList.add('open');
  };
  window.closeLightbox = function() {
    document.getElementById('lightboxBg').classList.remove('open');
  };

  function renderBodyHtml(body) {
    const regex = /\[\[img:(.+?)\]\]/g;
    const tokens = [];
    let lastIndex = 0, m;
    while ((m = regex.exec(body)) !== null) {
      if (m.index > lastIndex) tokens.push({ type: 'text', value: body.slice(lastIndex, m.index) });
      tokens.push({ type: 'img', url: m[1] });
      lastIndex = regex.lastIndex;
    }
    if (lastIndex < body.length) tokens.push({ type: 'text', value: body.slice(lastIndex) });

    let html = '';
    let i = 0;
    while (i < tokens.length) {
      const t = tokens[i];
      if (t.type === 'text') {
        html += escapeHtml(t.value);
        i++;
        continue;
      }
      // 이미지가 연속으로 나오면(사이에 공백·줄바꿈만 있어도) 한 줄 가로 갤러리로 묶는다
      const group = [];
      while (i < tokens.length) {
        if (tokens[i].type === 'img') { group.push(tokens[i].url); i++; }
        else if (tokens[i].type === 'text' && tokens[i].value.trim() === '') { i++; }
        else break;
      }
      if (group.length === 1) {
        html += `<div class="body-gallery g1"><img src="${group[0]}" onclick="openLightbox('${group[0]}')"></div>`;
      } else {
        const cls = group.length === 2 ? 'g2' : (group.length === 3 ? 'g3' : 'gmany');
        html += `<div class="body-gallery ${cls}">` +
          group.map(u => `<img src="${u}" onclick="openLightbox('${u}')">`).join('') +
          `</div>`;
      }
    }
    return html;
  }

  function renderList() {
    const box = document.getElementById('postList');
    if (window._posts.length === 0) {
      box.innerHTML = '<div class="empty-state">아직 등록된 글이 없습니다.</div>';
      return;
    }
    const isAdmin = document.getElementById('adminPanel').classList.contains('open');
    box.innerHTML = window._posts.map(p => {
      const plainBody = (p.body||'').replace(/\[\[img:.+?\]\]/g, '').trim();
      return `
      <div class="post-card" style="cursor:pointer;" onclick="goToPost(event, '${p.id}')">
        <div class="tag">#${escapeHtml(p.tag||'')}</div>
        <h2>${escapeHtml(p.title)}</h2>
        <p>${escapeHtml(plainBody.slice(0,80))}${plainBody.length>80?'...':''}</p>
        <div class="meta">${escapeHtml(p.dateLabel||'')}</div>
        ${isAdmin ? `<div class="post-card-admin-actions" onclick="event.preventDefault(); event.stopPropagation();">
          <button onclick="editPost('${p.id}')">✏️ 수정</button><button onclick="deletePost('${p.id}')">🗑 삭제</button>
        </div>` : ''}
      </div>
    `;
    }).join('');
  }

  window.goToPost = function(event, id) {
    history.pushState({}, '', '?post=' + id);
    const post = window._posts.find(p => p.id === id);
    if (post) showDetail(post);
  };

  window.showList = function() {
    history.pushState({}, '', location.pathname);
    document.getElementById('listView').style.display = 'block';
    document.getElementById('detailView').style.display = 'none';
    document.title = '글답 이야기 — 글답국어독서논술 학습 칼럼';
  };

  function showDetail(post) {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    const isAdmin = document.getElementById('adminPanel').classList.contains('open');
    document.getElementById('postDetailBox').innerHTML = `
      <div class="tag">#${escapeHtml(post.tag||'')}</div>
      <h1>${escapeHtml(post.title)}</h1>
      <div class="meta">${escapeHtml(post.dateLabel||'')}</div>
      <div class="body">${renderBodyHtml(post.body)}</div>
      ${isAdmin ? `<div class="post-card-admin-actions"><button onclick="editPost('${post.id}')">✏️ 수정</button><button onclick="deletePost('${post.id}')">🗑 삭제</button></div>` : ''}
    `;
    document.title = post.title + ' — 글답 이야기';
    window.scrollTo(0,0);
  }

  function handleRoute() {
    const params = new URLSearchParams(location.search);
    const postId = params.get('post');
    if (postId) {
      const post = window._posts.find(p => p.id === postId);
      if (post) { showDetail(post); return; }
    }
    showList();
  }

  window.addEventListener('popstate', handleRoute);
  loadPosts();
</script>
</body>
</html>
